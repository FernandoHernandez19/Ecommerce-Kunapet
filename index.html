<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e23d28" />

    <!-- Google Fonts — Inter (Premium typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />


    <!-- SEO Primary -->
    <title>KunaPet — Marketplace de Servicios para Mascotas</title>
    <meta
      name="description"
      content="Encuentra veterinarias, grooming, paseos y productos premium para tus mascotas. La plataforma líder en cuidado animal del Perú."
    />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kunapet.com/" />
    <meta property="og:title" content="KunaPet — Marketplace de Servicios para Mascotas" />
    <meta
      property="og:description"
      content="Encuentra veterinarias, grooming, paseos y productos premium para tus mascotas."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KunaPet — Marketplace de Servicios para Mascotas" />
    <meta
      name="twitter:description"
      content="Encuentra veterinarias, grooming, paseos y productos premium para tus mascotas."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
